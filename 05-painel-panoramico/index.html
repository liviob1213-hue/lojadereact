<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Painel panorâmico</title>
<!--
  EFEITO 05 — Painel de vidro sobre uma vista panorâmica
  Referência: "Glassy Dashboard V5" (code.xr).

  O que define o efeito:
  - O painel é vidro claro e quente por cima de uma janela panorâmica ao pôr do
    sol (montanhas, sala). Trilho de ícones à esquerda, menu de pílulas em cima.
  - Cada página entra de um jeito: na Início as barras do gráfico crescem e uma
    delas acende em azul; nas Mensagens os balões chegam alternando os lados;
    nos Salvos os cartões COLORIDOS voam da direita, girando de leve, e assentam
    em fileira.
  - A troca de página desfoca o conteúdo velho antes do novo entrar.

  O que o Manus fez: os nomes das abas certos (Home, Messages, Projects, Saved)
  e uma grade 2×2 que desliza — sem a vista, sem o trilho, sem gráfico, sem
  conversa e sem os cartões coloridos.
-->
<style>
  :root {
    --vidro: rgba(60, 54, 58, .34);
    --cartao: rgba(255, 255, 255, .08);
    --borda: rgba(255, 255, 255, .14);
    --texto: #fbf7f3;
    --texto-2: rgba(251, 247, 243, .72);
    --texto-3: rgba(251, 247, 243, .48);
    --azul: #4f8dff;
    --suave: cubic-bezier(.22, 1, .36, 1);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { overflow: hidden; color: var(--texto); font: 13px/1.45 "Inter", ui-sans-serif, system-ui, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }

  /* ---------------- a vista (sem foto: céu, montanhas, janela, chão) ---------------- */
  .vista { position: fixed; inset: 0;
    background: linear-gradient(180deg, #3d3a52 0%, #8a6a78 30%, #e2a173 55%, #f2c48d 64%, #6b5446 64.2%, #3f322b 100%); }
  .serra { position: absolute; left: 0; right: 0; top: 40%; height: 26%; }
  .serra.s1 { background: #5c5266; clip-path: polygon(0 70%, 8% 40%, 18% 58%, 28% 22%, 40% 52%, 52% 30%, 63% 55%, 76% 18%, 88% 48%, 100% 30%, 100% 100%, 0 100%); opacity: .75; }
  .serra.s2 { background: #463d4c; clip-path: polygon(0 80%, 12% 55%, 24% 72%, 36% 45%, 50% 70%, 62% 50%, 74% 76%, 86% 52%, 100% 70%, 100% 100%, 0 100%); }
  .caixilho { position: absolute; inset: 0; background: repeating-linear-gradient(90deg, transparent 0 24.6%, rgba(20,16,14,.85) 24.6% 25%); }
  .caixilho::after { content: ''; position: absolute; left: 0; right: 0; top: 64%; height: 1.5%; background: rgba(20,16,14,.9); }
  .sol { position: absolute; left: 62%; top: 44%; width: 120px; height: 120px; border-radius: 50%; background: radial-gradient(circle, #fff3c9, rgba(255,210,140,.3) 50%, transparent 70%); }

  /* ---------------- o painel ---------------- */
  .app { position: absolute; inset: 22px; display: grid; grid-template-columns: 52px 1fr; gap: 14px; }
  .trilho { align-self: center; display: flex; flex-direction: column; gap: 8px; padding: 10px 8px; border-radius: 999px;
    background: var(--vidro); backdrop-filter: blur(22px) saturate(150%); box-shadow: inset 0 1px 0 rgba(255,255,255,.3), inset 0 0 0 1px var(--borda); }
  .trilho i { width: 34px; height: 34px; border-radius: 50%; background: rgba(255,255,255,.08); }
  .trilho i.on { background: #fff; box-shadow: 0 4px 14px -4px rgba(0,0,0,.4); }
  .janela { display: flex; flex-direction: column; min-width: 0; border-radius: 26px; padding: 16px 20px;
    background: var(--vidro); backdrop-filter: blur(26px) saturate(160%); box-shadow: inset 0 1px 0 rgba(255,255,255,.3), inset 0 0 0 1px var(--borda), 0 40px 80px -40px rgba(0,0,0,.6); }
  .topo { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .topo h1 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -.01em; }
  nav { display: flex; gap: 3px; padding: 3px; margin-left: auto; border-radius: 999px; background: rgba(0,0,0,.14); }
  nav button { border: 0; background: none; color: var(--texto-2); padding: 6px 14px; border-radius: 999px; cursor: pointer; font-family: inherit; font-size: 12.5px; transition: background .25s, color .25s; }
  nav button[aria-current="page"] { background: #fff; color: #2a2326; }
  .avatar { width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg, #f2b27a, #c4654a); }

  .pagina { position: relative; flex: 1; min-height: 0; overflow: hidden; }
  .grade { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
  .c { padding: 14px 16px; border-radius: 18px; background: var(--cartao); box-shadow: inset 0 1px 0 rgba(255,255,255,.14); }
  .s2 { grid-column: span 2; } .s3 { grid-column: span 3; } .s4 { grid-column: span 4; }
  .c small { color: var(--texto-3); display: block; }
  .c b { font-size: 22px; }
  .c em { font-style: normal; font-size: 11px; color: #9bf2c1; }
  .barras { display: flex; align-items: flex-end; gap: 14px; height: 160px; padding-top: 10px; }
  .barras i { flex: 1; border-radius: 10px 10px 6px 6px; background: rgba(255,255,255,.22); transform-origin: bottom; }
  .barras i.acesa { background: linear-gradient(180deg, #7fb0ff, var(--azul)); box-shadow: 0 0 24px rgba(79,141,255,.6); }

  .conversa { display: grid; grid-template-columns: 210px 1fr; gap: 12px; height: 100%; }
  .contatos .c { margin-bottom: 8px; padding: 10px 12px; display: flex; gap: 10px; align-items: center; }
  .contatos .c.on { background: rgba(255,255,255,.18); }
  .contatos i { width: 28px; height: 28px; border-radius: 50%; flex: 0 0 auto; }
  .baloes { display: flex; flex-direction: column; gap: 10px; padding: 6px; }
  .balao { max-width: 62%; padding: 10px 14px; border-radius: 16px; background: rgba(255,255,255,.16); }
  .balao.meu { align-self: flex-end; background: var(--azul); }

  .salvos { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
  .salvo { height: 150px; border-radius: 18px; padding: 14px; display: flex; flex-direction: column; justify-content: space-between;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 18px 30px -18px rgba(0,0,0,.5); backdrop-filter: blur(10px); }
  .salvo b { font-size: 14px; }
  .salvo small { opacity: .85; }
</style>
</head>
<body>
  <div class="vista"><div class="sol"></div><div class="serra s1"></div><div class="serra s2"></div><div class="caixilho"></div></div>

  <div class="app">
    <aside class="trilho"><i class="on"></i><i></i><i></i><i></i><i></i><i></i></aside>
    <section class="janela">
      <header class="topo">
        <h1 id="titulo">Boa tarde, Roberto</h1>
        <nav id="nav"><button aria-current="page" data-p="inicio">Início</button><button data-p="mensagens">Mensagens</button><button data-p="salvos">Salvos</button></nav>
        <span class="avatar"></span>
      </header>
      <div class="pagina" id="pagina"></div>
    </section>
  </div>

<script>
  const reduzido = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const suave = 'cubic-bezier(.22,1,.36,1)';
  const mola = 'cubic-bezier(.34,1.4,.64,1)';
  const anima = (el, quadros, op) => (reduzido ? null : el.animate(quadros, { fill: 'backwards', ...op }));

  const PAGINAS = {
    inicio: {
      titulo: 'Boa tarde, Roberto',
      html: () => `<div class="grade">
        <div class="c"><small>Projetos ativos</small><b>12</b> <em>+2</em></div>
        <div class="c"><small>Receita</small><b>$48,2 mil</b> <em>+9%</em></div>
        <div class="c"><small>Horas na semana</small><b>36</b></div>
        <div class="c"><small>Entregas no prazo</small><b>89%</b></div>
        <div class="c s3"><small>Produtividade</small><div class="barras">${[42, 58, 50, 74, 66, 98, 62, 48, 70].map((h, i) => `<i class="${i === 5 ? 'acesa' : ''}" style="height:${h}%"></i>`).join('')}</div></div>
        <div class="c"><small>Tarefas</small>${['Revisar proposta', 'Ligar para Ana', 'Fechar sprint'].map((t) => `<div style="padding:7px 0;border-top:1px solid rgba(255,255,255,.1)">${t}</div>`).join('')}</div>
      </div>`,
      entrar: (p) => {
        p.querySelectorAll('.c').forEach((c, i) => anima(c, [{ opacity: 0, transform: 'translateY(14px)' }, { opacity: 1, transform: 'none' }], { duration: 520, delay: i * 50, easing: suave }));
        p.querySelectorAll('.barras i').forEach((b, i) => anima(b, [{ transform: 'scaleY(0)' }, { transform: 'scaleY(1)' }], { duration: 700, delay: 200 + i * 45, easing: mola }));
      },
    },
    mensagens: {
      titulo: 'Mensagens',
      html: () => `<div class="conversa"><div class="contatos">
        ${[['Ana Lúcia', '#f2a65a', 1], ['Bruno', '#8fb8ff'], ['Carla', '#b99bff'], ['Diego', '#7fe0b0'], ['Equipe', '#ff8f9b']].map(([n, c, on]) => `<div class="c ${on ? 'on' : ''}"><i style="background:${c}"></i>${n}</div>`).join('')}
        </div><div class="c baloes">
        ${[['Oi! Viu a versão nova da proposta?'], ['Vi agora, ficou ótima. Só ajustaria o prazo.', 1], ['Fechado. Mando até amanhã cedo.'], ['Perfeito, obrigado!', 1]].map(([t, meu]) => `<div class="balao ${meu ? 'meu' : ''}">${t}</div>`).join('')}
        </div></div>`,
      entrar: (p) => {
        p.querySelectorAll('.contatos .c').forEach((c, i) => anima(c, [{ opacity: 0, transform: 'translateX(-16px)' }, { opacity: 1, transform: 'none' }], { duration: 480, delay: i * 45, easing: suave }));
        p.querySelectorAll('.balao').forEach((b, i) => anima(b, [{ opacity: 0, transform: `translateX(${b.classList.contains('meu') ? 24 : -24}px) scale(.96)` }, { opacity: 1, transform: 'none' }], { duration: 520, delay: 220 + i * 140, easing: mola }));
      },
    },
    salvos: {
      titulo: 'Salvos',
      html: () => `<div class="salvos">${[
        ['Pesquisa de mercado', 'Relatório · 12 páginas', '#4f8dff'], ['Ideias de campanha', 'Notas · ontem', '#f0a24a'], ['Referências visuais', 'Pasta · 38 itens', '#9b7bff'],
        ['Roteiro do lançamento', 'Doc · 4 páginas', '#36c48a'], ['Contrato modelo', 'PDF · revisado', '#ef5b5b'], ['Paleta da marca', 'Cores · 9', '#5ac8e8'],
        ['Fornecedores', 'Planilha · 24 linhas', '#e6b93c'], ['Metas do trimestre', 'OKRs · 3', '#ff7eb6'],
      ].map(([t, s, c]) => `<div class="salvo" style="background:linear-gradient(160deg, ${c}e6, ${c}99)"><b>${t}</b><small>${s}</small></div>`).join('')}</div>`,
      entrar: (p) => {
        // voam da direita, girando de leve, e assentam em fileira
        p.querySelectorAll('.salvo').forEach((c, i) => anima(c, [
          { opacity: 0, transform: `translateX(${260 + i * 30}px) rotate(${6 + (i % 3) * 3}deg) scale(.9)` },
          { opacity: 1, transform: 'none' },
        ], { duration: 780, delay: i * 70, easing: mola }));
      },
    },
  };

  const pagina = document.getElementById('pagina'), titulo = document.getElementById('titulo');
  let vez = 0;
  async function ir(nome, primeira = false) {
    const minha = ++vez;
    if (!primeira && !reduzido) {
      await pagina.animate([{ opacity: 1, filter: 'blur(0)' }, { opacity: 0, filter: 'blur(10px)' }], { duration: 200, fill: 'forwards' }).finished;
      if (minha !== vez) return;
    }
    const def = PAGINAS[nome];
    pagina.getAnimations().forEach((a) => a.cancel());
    pagina.innerHTML = def.html();
    titulo.textContent = def.titulo;
    if (!reduzido) titulo.animate([{ opacity: 0, filter: 'blur(6px)' }, { opacity: 1, filter: 'none' }], { duration: 400, easing: suave });
    def.entrar(pagina);
  }

  document.getElementById('nav').addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b || b.getAttribute('aria-current') === 'page') return;
    document.querySelectorAll('#nav button').forEach((x) => x.removeAttribute('aria-current'));
    b.setAttribute('aria-current', 'page');
    ir(b.dataset.p);
  });
  ir('inicio', true);
</script>
</body>
</html>
