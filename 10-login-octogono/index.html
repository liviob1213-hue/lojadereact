<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Login que vira octógono</title>
<!--
  EFEITO 10 — Entrar ↔ Criar conta, passando por um octógono
  Referência: "Glassy Login Form v3".

  O que define o efeito, ao trocar de "Entrar" para "Criar conta":
  1. O formulário se desfaz em desfoque.
  2. O cartão (cantos chanfrados em cima à esquerda e embaixo à direita)
     vira um OCTÓGONO — os quatro cantos chanfrados.
  3. Os dois pedaços de canto que flutuavam fora do cartão voam para o centro
     e viram o logo: dois triângulos com uma fresta na diagonal.
  4. Um anel de luz pulsa a partir do logo.
  5. O octógono volta a ser cartão, já do tamanho do formulário novo; os
     triângulos voltam para os cantos; os campos entram um a um.

  Como é feito: o formato é um clip-path polygon de 8 pontos com calc(), o que
  deixa o navegador interpolar de um formato para o outro. A borda clara é um
  drop-shadow no embrulho — ele segue o recorte, qualquer que seja.

  O que o Manus fez: campos que aparecem e somem, sem octógono, sem logo, sem
  anel — e o "confirmar senha" sumia sem animação por não estar no
  AnimatePresence.
-->
<style>
  :root {
    --fundo: #04070d;
    --vidro: rgba(14, 30, 44, .6);
    --texto: #eaf6ff;
    --texto-2: rgba(234, 246, 255, .58);
    --texto-3: rgba(234, 246, 255, .36);
    --ciano: #49c6ff;
    --campo: rgba(0, 0, 0, .28);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    display: grid; place-items: center; overflow: hidden; color: var(--texto);
    font-family: "Inter", ui-sans-serif, system-ui, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased;
    background:
      linear-gradient(115deg, transparent 28%, rgba(73,198,255,.16) 40%, transparent 48%),
      linear-gradient(150deg, transparent 52%, rgba(73,198,255,.12) 60%, transparent 68%),
      linear-gradient(170deg, transparent 70%, rgba(200,220,255,.08) 76%, transparent 82%),
      radial-gradient(60% 50% at 85% 20%, rgba(20,90,140,.45), transparent 70%), var(--fundo);
  }
  .palco { position: relative; width: min(420px, 92vw); }
  /* o embrulho dá a borda: o drop-shadow contorna o que o clip-path deixou */
  .embrulho { filter: drop-shadow(0 0 1px rgba(150, 215, 255, .75)) drop-shadow(0 0 18px rgba(73, 198, 255, .18)); }
  .cartao {
    position: relative; overflow: hidden; padding: 30px 28px 24px;
    background: linear-gradient(160deg, rgba(40,80,110,.35), rgba(10,22,34,.55)), var(--vidro);
    backdrop-filter: blur(22px) saturate(150%);
    --a: 44px; --b: 0px; --c: 44px; --d: 0px;
    clip-path: polygon(44px 0, 100% 0, 100% 0px, 100% calc(100% - 44px), calc(100% - 44px) 100%, 0px 100%, 0 100%, 0 44px);
  }
  .canto { position: absolute; width: 38px; height: 38px; z-index: 2; pointer-events: none;
    background: linear-gradient(135deg, rgba(120, 210, 255, .55), rgba(40, 140, 220, .25));
    filter: drop-shadow(0 0 1px rgba(170,225,255,.9)) drop-shadow(0 0 8px rgba(73,198,255,.4)); }
  .canto.c1 { left: -12px; top: -12px; clip-path: polygon(0 0, 100% 0, 0 100%); }
  .canto.c2 { right: -12px; bottom: -12px; clip-path: polygon(100% 0, 100% 100%, 0 100%); }
  .anel { position: absolute; left: 50%; top: 50%; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%; z-index: 1;
    pointer-events: none; opacity: 0; box-shadow: 0 0 0 2px rgba(73,198,255,.7), 0 0 30px rgba(73,198,255,.5), inset 0 0 30px rgba(73,198,255,.35); }

  h1 { margin: 0; font-size: 22px; letter-spacing: -.01em; }
  h1 em { font-style: normal; background: linear-gradient(90deg, #7fdcff, #2f9bff); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .sub { margin: 4px 0 18px; font-size: 12px; color: var(--texto-2); }
  label { display: block; font-size: 11.5px; color: var(--texto-2); margin: 10px 0 5px; }
  .campo { display: flex; align-items: center; gap: 9px; height: 38px; padding: 0 12px; border-radius: 10px; background: var(--campo);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.08); transition: box-shadow .2s; }
  .campo:focus-within { box-shadow: inset 0 0 0 1px var(--ciano), 0 0 0 3px rgba(73,198,255,.15); }
  .campo svg { width: 14px; height: 14px; color: var(--texto-3); flex: 0 0 auto; }
  .campo input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; color: var(--texto); font: inherit; font-size: 12.5px; }
  .campo input::placeholder { color: var(--texto-3); }
  .dupla { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .linha { display: flex; align-items: center; justify-content: space-between; margin: 12px 0; font-size: 11.5px; color: var(--texto-2); }
  .linha label { display: flex; align-items: center; gap: 6px; margin: 0; }
  .linha input { accent-color: var(--ciano); }
  .linha a, .troca button { color: var(--ciano); text-decoration: none; }
  .principal { width: 100%; height: 40px; border: 0; border-radius: 10px; cursor: pointer; color: #04121e; font-weight: 700; font-family: inherit;
    background: linear-gradient(180deg, #7fdcff, #33b0f5); box-shadow: 0 8px 24px -10px rgba(73,198,255,.8); }
  .sociais { display: flex; justify-content: center; gap: 10px; margin-top: 14px; }
  .sociais span { padding: 7px 16px; border-radius: 9px; font-size: 12px; background: rgba(255,255,255,.06); box-shadow: inset 0 0 0 1px rgba(255,255,255,.1); }
  .troca { margin-top: 14px; text-align: center; font-size: 12px; color: var(--texto-3); }
  .troca button { border: 0; background: none; font: inherit; cursor: pointer; padding: 0; }
</style>
</head>
<body>
  <div class="palco" id="palco">
    <div class="canto c1" id="c1"></div><div class="canto c2" id="c2"></div>
    <div class="embrulho"><section class="cartao" id="cartao"><div class="anel" id="anel"></div><div id="conteudo"></div></section></div>
  </div>

<script>
  const ICONE = {
    email: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 7 8 6 8-6"/></svg>',
    senha: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>',
    nome: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4.5 20c1.3-3.6 4-5.4 7.5-5.4s6.2 1.8 7.5 5.4"/></svg>',
  };
  const campo = (rot, tipo, icone, ph) => `<label>${rot}<div class="campo">${ICONE[icone]}<input type="${tipo}" placeholder="${ph}" autocomplete="${tipo === 'password' ? 'current-password' : tipo === 'email' ? 'email' : 'name'}" /></div></label>`;
  const FORMS = {
    entrar: () => `
      <h1>Bem-vindo <em>de volta</em></h1><p class="sub">Entre com os seus dados para acessar a sua conta.</p>
      ${campo('E-mail', 'email', 'email', 'voce@email.com')}
      ${campo('Senha', 'password', 'senha', '••••••••')}
      <div class="linha"><label><input type="checkbox" checked /> Lembrar de mim</label><a href="#">Esqueci a senha</a></div>
      <button class="principal">Entrar →</button>
      <div class="sociais"><span>Google</span><span>Apple</span></div>
      <div class="troca">Não tem conta? <button data-ir="criar">Criar conta</button></div>`,
    criar: () => `
      <h1>Criar <em>conta</em></h1><p class="sub">Comece hoje e organize o seu espaço de trabalho.</p>
      ${campo('Nome completo', 'text', 'nome', 'Seu nome')}
      ${campo('E-mail', 'email', 'email', 'voce@email.com')}
      <div class="dupla">${campo('Senha', 'password', 'senha', '••••••')}${campo('Confirmar senha', 'password', 'senha', '••••••')}</div>
      <div class="linha"><label><input type="checkbox" /> Concordo com os Termos e a Privacidade</label></div>
      <button class="principal">Criar conta →</button>
      <div class="sociais"><span>Google</span><span>Apple</span></div>
      <div class="troca">Já tem conta? <button data-ir="entrar">Entrar</button></div>`,
  };

  const $ = (id) => document.getElementById(id);
  const cartao = $('cartao'), conteudo = $('conteudo');
  const reduzido = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const suave = 'cubic-bezier(.22,1,.36,1)';

  // 8 pontos sempre, para o navegador conseguir interpolar um formato no outro:
  // a = canto de cima à esquerda, b = cima/direita, c = baixo/direita, d = baixo/esquerda
  const forma = (a, b, c, d) =>
    `polygon(${a}px 0, calc(100% - ${b}px) 0, 100% ${b}px, 100% calc(100% - ${c}px), calc(100% - ${c}px) 100%, ${d}px 100%, 0 calc(100% - ${d}px), 0 ${a}px)`;
  const CARTAO = forma(44, 0, 44, 0);

  function entrarCampos() {
    if (reduzido) return;
    [...conteudo.children].forEach((el, i) => el.animate(
      [{ opacity: 0, transform: 'translateY(8px)', filter: 'blur(4px)' }, { opacity: 1, transform: 'none', filter: 'none' }],
      { duration: 420, delay: i * 45, easing: suave, fill: 'backwards' }));
  }

  // ---------------------------------------------------------------- a troca
  let trocando = false;
  async function trocar(para) {
    if (trocando) return;
    trocando = true;
    if (reduzido) { conteudo.innerHTML = FORMS[para](); trocando = false; return; }

    const altoAntes = cartao.offsetHeight, largura = cartao.offsetWidth;
    // 1. o formulário se desfaz
    await conteudo.animate([{ opacity: 1, filter: 'blur(0)' }, { opacity: 0, filter: 'blur(10px)' }], { duration: 220, fill: 'forwards' }).finished;

    // 2. vira octógono (quadrado, cantos iguais) e encolhe um pouco
    const lado = Math.min(largura, 360);
    const oct = Math.round(lado * 0.29);
    cartao.style.height = altoAntes + 'px';
    const virar = cartao.animate([
      { clipPath: CARTAO, height: altoAntes + 'px' },
      { clipPath: forma(oct, oct, oct, oct), height: lado + 'px' },
    ], { duration: 520, easing: suave, fill: 'forwards' });

    // 3. os pedaços de canto voam para o centro e viram o logo
    // o centro do octógono é o centro do logo; cada triângulo vai para lá,
    // afastado 4px do outro ao longo da diagonal — a fresta do logo
    const caixa = cartao.getBoundingClientRect();
    const alvoX = caixa.left + caixa.width / 2, alvoY = caixa.top + lado / 2;
    // o de baixo se prende à base do cartão, que sobe (altoAntes − lado) enquanto ele encolhe
    const voar = (el, fresta, sobe = 0) => {
      const r = el.getBoundingClientRect();
      const dx = alvoX - (r.left + r.width / 2) + fresta, dy = alvoY - (r.top + r.height / 2) + fresta + sobe;
      return el.animate([{ transform: 'none' }, { transform: `translate(${dx}px, ${dy}px) scale(1.6)` }],
        { duration: 560, easing: 'cubic-bezier(.65,0,.35,1)', fill: 'forwards' });
    };
    const f1 = voar($('c1'), -4), f2 = voar($('c2'), 4, altoAntes - lado);
    await virar.finished;

    // 4. o anel pulsa a partir do logo
    await $('anel').animate([{ opacity: .9, transform: 'scale(.5)' }, { opacity: 0, transform: 'scale(2.6)' }], { duration: 700, easing: 'cubic-bezier(.2,.6,.3,1)' }).finished;

    // 5. o formulário novo entra no tamanho dele, e os cantos voltam
    conteudo.getAnimations().forEach((a) => a.cancel());
    conteudo.style.opacity = '0';
    conteudo.innerHTML = FORMS[para]();
    cartao.style.height = '';
    const altoDepois = cartao.offsetHeight;
    cartao.style.height = lado + 'px';
    virar.cancel();
    const voltar = cartao.animate([
      { clipPath: forma(oct, oct, oct, oct), height: lado + 'px' },
      { clipPath: CARTAO, height: altoDepois + 'px' },
    ], { duration: 560, easing: suave });
    f1.reverse(); f2.reverse();
    conteudo.style.opacity = '';
    entrarCampos();
    await voltar.finished;
    cartao.style.height = '';
    trocando = false;
  }

  conteudo.addEventListener('click', (e) => {
    const b = e.target.closest('[data-ir]');
    if (b) { e.preventDefault(); trocar(b.dataset.ir); }
    if (e.target.closest('.principal, a')) e.preventDefault(); // demonstração: não envia nada
  });

  conteudo.innerHTML = FORMS.entrar();
  entrarCampos();
</script>
</body>
</html>
