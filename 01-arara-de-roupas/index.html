<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Arara de roupas</title>
<!--
  EFEITO 01 — Arara de roupas
  Referência: "Clothes Closet Website in 2026".

  O que define o efeito:
  1. As peças ficam penduradas num trilho, DE PERFIL (giradas ~70° no eixo Y),
     como numa arara de verdade. A que está sob o mouse gira de frente e abre
     espaço empurrando as vizinhas.
  2. Clicar traz a peça para o centro, maior; as outras se rearrumam em volta,
     desfocadas, sem perder a ordem.
  3. Ao lado da peça aparecem etiquetas penduradas, uma por cor. Trocar de cor
     é uma cortina que desce de cima para baixo sobre a peça.
  4. Um seletor Frente/Costas gira a peça 180° — nas costas, o número.

  Como é feito: SVG desenhado aqui (cabide + peça), 3D de CSS (perspective +
  rotateY + backface-visibility), posições calculadas pelo offsetLeft para não
  depender de medidas no meio de uma transição. Marca e estampas inventadas.

  O que o Manus fez: uma grade de cartões com emoji de roupa e um modal —
  sem trilho, sem giro, sem cortina, sem frente/costas.
-->
<style>
  :root {
    --fundo: #eeeeec;
    --texto: #16171a;
    --texto-2: #6b6d72;
    --mola: cubic-bezier(.22, 1, .36, 1);
    --cortina: cubic-bezier(.65, 0, .35, 1);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { overflow: hidden; color: var(--texto); background: radial-gradient(70% 60% at 50% 35%, #fafaf9, var(--fundo));
    font-family: "Inter", ui-sans-serif, system-ui, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }

  header { position: absolute; top: 22px; left: 0; right: 0; text-align: center; z-index: 5; pointer-events: none; }
  .marca { font-weight: 900; letter-spacing: .32em; font-size: 15px; }
  .palco { position: absolute; inset: 0; }
  .trilho { position: absolute; top: 116px; left: 9%; right: 9%; height: 7px; border-radius: 4px;
    background: linear-gradient(180deg, #fdfdfd, #b9bbbf 55%, #8e9095); box-shadow: 0 3px 6px rgba(0,0,0,.12); transition: opacity .5s, filter .5s; }
  .trilho::before, .trilho::after { content: ""; position: absolute; top: -8px; width: 4px; height: 22px; border-radius: 2px; background: #a3a5aa; }
  .trilho::before { left: 0; } .trilho::after { right: 0; }
  .foco .trilho { opacity: .3; filter: blur(4px); }

  .fila { position: absolute; top: 106px; left: 0; right: 0; display: flex; justify-content: center; gap: 8px; }
  .peca { position: relative; flex: none; width: 92px; height: 370px; perspective: 900px; cursor: pointer; outline: none;
    transition: transform .75s var(--mola), filter .55s, opacity .55s; transform-origin: 50% 0; }
  .peca:focus-visible::after { content: ""; position: absolute; left: 50%; top: 330px; width: 24px; height: 3px; margin-left: -12px; border-radius: 2px; background: #2f6bff; }
  .cabide { position: absolute; left: 50%; top: 0; width: 230px; height: 322px; margin-left: -115px; transform-origin: 50% 4px;
    transform: rotateY(70deg); transform-style: preserve-3d; transition: transform .8s var(--mola); }
  .palco:not(.foco) .peca:hover .cabide, .peca.ativa .cabide { transform: rotateY(0deg); }
  .giro { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform .9s var(--cortina); }
  .peca.virada .giro { transform: rotateY(180deg); }
  .lado { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
  .lado.c { transform: rotateY(180deg); }
  .lado svg, .camada svg { width: 100%; height: 100%; display: block; overflow: visible; filter: drop-shadow(0 10px 14px rgba(0,0,0,.18)); }
  .camada { position: absolute; inset: 0; }

  .peca.ativa { z-index: 3; }
  .peca.longe { filter: blur(6px); opacity: .75; }

  /* etiquetas: só na peça em destaque */
  .etiquetas { position: absolute; left: calc(100% - 26px); top: 18px; display: flex; gap: 5px; opacity: 0; transform: translateY(-6px);
    pointer-events: none; transition: opacity .3s, transform .4s var(--mola); }
  .ativa .etiquetas { opacity: 1; transform: none; pointer-events: auto; transition-delay: .35s; }
  .etiqueta { position: relative; width: 15px; height: 42px; margin-top: 18px; padding: 0; border: 0; border-radius: 2px; cursor: pointer;
    background: var(--c); box-shadow: 0 3px 6px rgba(0,0,0,.18); transition: transform .3s var(--mola); transform-origin: 50% -18px; }
  .etiqueta::before { content: ""; position: absolute; left: 50%; bottom: 100%; width: 1px; height: 18px; background: #9a9ca1; }
  .etiqueta::after { content: ""; position: absolute; left: 50%; top: 4px; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: #eeeeec; }
  .etiqueta span { position: absolute; left: 0; right: 0; top: 11px; writing-mode: vertical-rl; font-size: 5.5px; font-weight: 800; letter-spacing: .12em;
    color: rgba(255,255,255,.85); text-transform: uppercase; line-height: 15px; }
  .etiqueta:hover { transform: rotate(-6deg); }
  .etiqueta[aria-pressed="true"] { outline: 1.5px solid var(--texto); outline-offset: 2px; }

  .dica { position: absolute; top: 500px; left: 0; right: 0; margin: 0; text-align: center; font-size: 12px; color: var(--texto-2); transition: opacity .4s; }
  .foco .dica { opacity: 0; }
  .info { position: absolute; top: 566px; left: 50%; transform: translateX(-50%); text-align: center; opacity: 0; filter: blur(8px);
    pointer-events: none; transition: opacity .45s, filter .45s; white-space: nowrap; }
  .foco .info { opacity: 1; filter: none; pointer-events: auto; transition-delay: .25s; }
  .info h2 { margin: 0; font-size: 12px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
  .info p { margin: 4px 0 12px; font-size: 12px; color: var(--texto-2); }
  .lados { display: inline-flex; padding: 3px; border-radius: 999px; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.08), inset 0 0 0 1px rgba(0,0,0,.08); }
  .lados button { border: 0; background: none; padding: 5px 14px; border-radius: 999px; font-family: inherit; font-size: 11px; font-weight: 600; color: var(--texto-2); cursor: pointer; }
  .lados button[aria-pressed="true"] { background: var(--texto); color: #fff; }
  .voltar { display: block; margin: 12px auto 0; border: 0; background: none; font-family: inherit; font-size: 11px; color: var(--texto-2); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }

  /* tela estreita: a arara inteira encolhe junto, sem refazer as contas */
  @media (max-width: 880px) { .palco { transform: scale(.62); transform-origin: 50% 0; } header { top: 14px; } }
  @media (max-width: 560px) { .palco { transform: scale(.44); } }
  @media (prefers-reduced-motion: reduce) { .peca, .cabide, .giro { transition-duration: .01s; } }
</style>
</head>
<body>
  <!-- dobras do tecido: um degradê só, usado por todas as peças -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
    <linearGradient id="dobra" x1="0" x2="1"><stop offset="0" stop-color="#000" stop-opacity=".22"/><stop offset=".22" stop-color="#000" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".06"/><stop offset=".78" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".26"/></linearGradient>
    <linearGradient id="queda" x1="0" y1="0" x2="0" y2="1"><stop offset=".6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".16"/></linearGradient>
  </defs></svg>

  <header><div class="marca">VARAL</div></header>
  <main class="palco" id="palco">
    <div class="trilho"></div>
    <div class="fila" id="fila"></div>
    <p class="dica">Passe o mouse para girar a peça · clique para ver de perto</p>
    <section class="info" id="info" aria-live="polite">
      <h2 id="nome"></h2><p id="preco"></p>
      <div class="lados" role="group" aria-label="Lado da peça">
        <button data-lado="f" aria-pressed="true">Frente</button><button data-lado="c" aria-pressed="false">Costas</button>
      </div>
      <button class="voltar" id="voltar">Voltar à arara</button>
    </section>
  </main>

<script>
  // ------------------------------------------------------------ as peças
  const PECAS = [
    { nome: 'Moletom Neblina', preco: 289, tipo: 'moletom', cores: [{ nome: 'Petróleo', base: '#4f8197', friso: '#3c6578' }, { nome: 'Areia', base: '#c9b79c', friso: '#a8977d' }] },
    { nome: 'Regata Alvorada', preco: 179, tipo: 'regata', numero: '23', costasNome: 'RIBEIRO',
      cores: [{ nome: 'Preto', base: '#17181c', friso: '#f2f2f2', tinta: '#f2f2f2' }, { nome: 'Azul', base: '#2443a6', friso: '#e8424a', tinta: '#ffffff' }] },
    { nome: 'Jaqueta Caramelo', preco: 349, tipo: 'jaqueta', cores: [{ nome: 'Caramelo', base: '#9a6845', friso: '#6f4a30' }, { nome: 'Oliva', base: '#6b7047', friso: '#4f5334' }] },
    { nome: 'Camiseta Grafite', preco: 129, tipo: 'camiseta', estampa: 'VARAL', cores: [{ nome: 'Grafite', base: '#25272c', friso: '#3a3c42', tinta: '#e9e9e9' }, { nome: 'Off', base: '#e8e4dc', friso: '#d3cec4', tinta: '#25272c' }] },
    { nome: 'Corta-vento Listra', preco: 319, tipo: 'jaqueta', listra: true, cores: [{ nome: 'Preto', base: '#1f2024', friso: '#eaeaea' }, { nome: 'Marinho', base: '#1d2a4d', friso: '#f2c94c' }] },
    { nome: 'Camiseta Brasa', preco: 139, tipo: 'camiseta', estampa: '1987', cores: [{ nome: 'Vermelho', base: '#c62b33', friso: '#a3222a', tinta: '#fff4e6' }, { nome: 'Preto', base: '#1b1c20', friso: '#2c2d32', tinta: '#e9483f' }] },
    { nome: 'Moletom Cobalto', preco: 299, tipo: 'moletom', cores: [{ nome: 'Cobalto', base: '#2d42a0', friso: '#22337d' }, { nome: 'Vinho', base: '#6e2433', friso: '#541b27' }] },
    { nome: 'Sobretudo Pedra', preco: 489, tipo: 'casaco', cores: [{ nome: 'Pedra', base: '#72767d', friso: '#585b61' }, { nome: 'Camelo', base: '#b08a5e', friso: '#8c6d48' }] },
  ];

  const CORPO = {
    regata: 'M64 34 Q100 62 136 34 L148 37 Q144 78 166 100 L166 262 Q100 270 34 262 L34 100 Q56 78 52 37 Z',
    camiseta: 'M70 34 Q100 54 130 34 L178 58 L162 104 L146 96 L146 262 L54 262 L54 96 L38 104 L22 58 Z',
    moletom: 'M68 38 Q100 56 132 38 L166 58 Q184 134 184 230 L160 232 L150 124 L150 262 L50 262 L50 124 L40 232 L16 230 Q16 134 34 58 Z',
    jaqueta: 'M68 36 Q100 52 132 36 L166 56 Q184 130 184 226 L160 228 L150 122 L150 250 L50 250 L50 122 L40 228 L16 226 Q16 130 34 56 Z',
    casaco: 'M68 36 Q100 52 132 36 L166 56 Q182 134 182 240 L162 242 L152 122 L160 270 L40 270 L48 122 L38 242 L18 240 Q18 134 34 56 Z',
  };

  const CABIDE = `<path d="M100 6 c7 0 10 8 4 12 c-3 2 -4 4 -4 9" fill="none" stroke="#8d8f94" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M100 27 L50 41 Q45 44 51 45 L149 45 Q155 44 150 41 Z" fill="#8a5a35"/>`;

  // uma face da peça (f = frente, c = costas), cabide incluído
  function desenho(p, cor, lado) {
    const d = CORPO[p.tipo];
    const frente = lado === 'f';
    const contorno = cor.friso === cor.tinta ? cor.base : cor.friso;
    let det = '';
    if (p.tipo === 'regata') {
      det += `<path d="M64 34 Q100 62 136 34" fill="none" stroke="${cor.friso}" stroke-width="5"/>
        <path d="M52 37 Q56 78 34 100 M148 37 Q144 78 166 100" fill="none" stroke="${cor.friso}" stroke-width="4"/>`;
      det += frente
        ? `<circle cx="100" cy="92" r="9" fill="none" stroke="${cor.tinta}" stroke-width="2"/><path d="M95 95 l5 -8 l5 8" fill="none" stroke="${cor.tinta}" stroke-width="2"/>
           <text x="100" y="134" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-weight="900" font-size="26" fill="${cor.tinta}" stroke="${contorno}" stroke-width="1.2" paint-order="stroke">Alvorada</text>
           <text x="100" y="148" text-anchor="middle" font-size="6" letter-spacing="2" fill="${cor.tinta}" opacity=".7">CLUBE DE BAIRRO</text>`
        : `<text x="100" y="86" text-anchor="middle" font-weight="900" font-size="12" letter-spacing="2" fill="${cor.tinta}">${p.costasNome}</text>
           <text x="100" y="176" text-anchor="middle" font-family="Impact, 'Arial Black', sans-serif" font-size="84" fill="${cor.tinta}" stroke="${contorno}" stroke-width="3" paint-order="stroke">${p.numero}</text>`;
    }
    if (p.tipo === 'camiseta') {
      det += `<path d="M70 34 Q100 54 130 34" fill="none" stroke="${cor.friso}" stroke-width="5"/>`;
      det += frente
        ? `<rect x="70" y="92" width="60" height="44" rx="3" fill="none" stroke="${cor.tinta}" stroke-width="2"/>
           <text x="100" y="122" text-anchor="middle" font-family="Impact, 'Arial Black', sans-serif" font-size="22" fill="${cor.tinta}">${p.estampa}</text>`
        : `<text x="100" y="66" text-anchor="middle" font-size="6" font-weight="800" letter-spacing="2" fill="${cor.tinta}" opacity=".7">VARAL</text>`;
    }
    if (p.tipo === 'moletom') {
      const capuz = 'M68 40 Q64 6 100 6 Q136 6 132 40 Q100 60 68 40 Z';
      det = `<path d="${capuz}" fill="${cor.base}"/><path d="${capuz}" fill="#000" opacity="${frente ? .3 : .08}"/>` + det;
      if (frente) det += `<path d="M64 198 L136 198 L146 246 L54 246 Z" fill="none" stroke="${cor.friso}" stroke-width="3"/>
        <path d="M92 52 v34 M108 52 v34" stroke="#f1f1f1" stroke-width="2" stroke-linecap="round"/>`;
      det += `<path d="M50 256 h100 M40 222 l20 2 M160 222 l-20 2" stroke="${cor.friso}" stroke-width="6"/>`;
    }
    if (p.tipo === 'jaqueta') {
      det += `<path d="M68 36 Q100 52 132 36 L126 30 Q100 44 74 30 Z" fill="${cor.friso}"/>`;
      if (frente) det += `<path d="M100 46 V250" stroke="${cor.friso}" stroke-width="3"/><path d="M60 140 h22 M118 140 h22" stroke="${cor.friso}" stroke-width="3"/>`;
      if (p.listra) det += `<path d="M30 70 L22 222 M170 70 L178 222" stroke="${cor.friso}" stroke-width="6"/>`;
      det += `<path d="M50 245 h100" stroke="${cor.friso}" stroke-width="8"/>`;
    }
    if (p.tipo === 'casaco') {
      det += `<path d="M68 36 L100 96 L132 36" fill="none" stroke="${cor.friso}" stroke-width="4"/>`;
      if (frente) det += [112, 150, 188].map((y) => `<circle cx="110" cy="${y}" r="4" fill="${cor.friso}"/>`).join('') + `<path d="M100 96 V270" stroke="${cor.friso}" stroke-width="2"/>`;
      det += `<path d="M48 160 h104" stroke="${cor.friso}" stroke-width="7"/>`;
    }
    return `<svg viewBox="0 0 200 280" aria-hidden="true">${CABIDE}
      <path d="${d}" fill="${cor.base}"/>${det}
      <path d="${d}" fill="url(#dobra)"/><path d="${d}" fill="url(#queda)"/></svg>`;
  }

  // ------------------------------------------------------------ montagem
  const $ = (id) => document.getElementById(id);
  const palco = $('palco'), fila = $('fila');
  const reais = (v) => v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
  const estado = PECAS.map(() => ({ cor: 0, lado: 'f' }));
  let ativa = -1;

  fila.innerHTML = PECAS.map((p, i) => `
    <div class="peca" data-i="${i}" role="button" tabindex="0" aria-label="${p.nome}">
      <div class="cabide">
        <div class="giro"><div class="lado f">${desenho(p, p.cores[0], 'f')}</div><div class="lado c">${desenho(p, p.cores[0], 'c')}</div></div>
        <div class="etiquetas">${p.cores.map((c, k) => `<button class="etiqueta" style="--c:${c.base}" data-cor="${k}" aria-pressed="${k === 0}" aria-label="Cor ${c.nome}"><span>${c.nome}</span></button>`).join('')}</div>
      </div>
    </div>`).join('');
  const pecas = [...fila.children];

  // ------------------------------------------------------------ passar o mouse: abre espaço
  pecas.forEach((el, i) => el.addEventListener('pointerenter', () => {
    if (ativa >= 0) return;
    pecas.forEach((o, j) => { o.style.transform = j === i ? '' : `translateX(${j < i ? -64 : 64}px)`; });
  }));
  fila.addEventListener('pointerleave', () => { if (ativa < 0) pecas.forEach((o) => { o.style.transform = ''; }); });

  // ------------------------------------------------------------ foco
  function focar(i) {
    ativa = i;
    palco.classList.add('foco');
    // posições de layout (offsetLeft ignora transform: não importa onde a animação está)
    const centro = fila.clientWidth / 2;
    const base = pecas.map((el) => el.offsetLeft + el.offsetWidth / 2);
    pecas.forEach((el, j) => {
      el.classList.toggle('ativa', j === i);
      el.classList.toggle('longe', j !== i);
      if (j === i) { el.style.transform = `translateX(${centro - base[j]}px) translateY(26px) scale(1.25)`; return; }
      const k = Math.abs(j - i);
      const alvo = j < i ? centro - 200 - (k - 1) * 100 : centro + 260 + (k - 1) * 100;
      el.style.transform = `translateX(${alvo - base[j]}px)`;
    });
    const p = PECAS[i];
    $('nome').textContent = p.nome;
    $('preco').textContent = `${reais(p.preco)} · ${p.cores[estado[i].cor].nome}`;
    marcarLado(estado[i].lado);
  }
  function sair() {
    if (ativa < 0) return;
    ativa = -1;
    palco.classList.remove('foco');
    pecas.forEach((el) => { el.classList.remove('ativa', 'longe'); el.style.transform = ''; });
  }

  // ------------------------------------------------------------ cor: a cortina desce
  function trocarCor(i, k) {
    const p = PECAS[i], e = estado[i];
    if (e.cor === k) return;
    e.cor = k;
    const el = pecas[i], cor = p.cores[k];
    el.querySelectorAll('.etiqueta').forEach((b) => b.setAttribute('aria-pressed', String(+b.dataset.cor === k)));
    $('preco').textContent = `${reais(p.preco)} · ${cor.nome}`;
    const outro = e.lado === 'f' ? 'c' : 'f';
    const visivel = el.querySelector(`.lado.${e.lado}`);
    el.querySelector(`.lado.${outro}`).innerHTML = desenho(p, cor, outro);
    const camada = document.createElement('div');
    camada.className = 'camada';
    camada.innerHTML = desenho(p, cor, e.lado);
    visivel.querySelectorAll('.camada').forEach((c) => c.remove());
    visivel.appendChild(camada);
    const a = camada.animate([{ clipPath: 'inset(0 0 100% 0)' }, { clipPath: 'inset(0 0 0% 0)' }],
      { duration: matchMedia('(prefers-reduced-motion: reduce)').matches ? 1 : 750, easing: 'cubic-bezier(.65,0,.35,1)' });
    a.onfinish = () => { if (camada.isConnected) visivel.innerHTML = camada.innerHTML; };
  }

  // ------------------------------------------------------------ frente / costas
  function marcarLado(l) {
    document.querySelectorAll('.lados button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.lado === l)));
  }
  function virar(l) {
    if (ativa < 0) return;
    estado[ativa].lado = l;
    pecas[ativa].classList.toggle('virada', l === 'c');
    marcarLado(l);
  }

  // ------------------------------------------------------------ eventos
  palco.addEventListener('click', (e) => {
    const etiqueta = e.target.closest('.etiqueta');
    if (etiqueta) { trocarCor(ativa, +etiqueta.dataset.cor); return; }
    const lado = e.target.closest('.lados button');
    if (lado) { virar(lado.dataset.lado); return; }
    if (e.target.closest('#voltar')) { sair(); return; }
    const peca = e.target.closest('.peca');
    if (peca) { if (+peca.dataset.i !== ativa) focar(+peca.dataset.i); return; }
    if (!e.target.closest('.info')) sair();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') sair();
    if ((e.key === 'Enter' || e.key === ' ') && e.target.classList.contains('peca')) { e.preventDefault(); focar(+e.target.dataset.i); }
    if (ativa >= 0 && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) focar((ativa + (e.key === 'ArrowRight' ? 1 : -1) + PECAS.length) % PECAS.length);
  });
</script>
</body>
</html>
