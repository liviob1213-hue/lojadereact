<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Escritório 3D com IA</title>
<!--
  EFEITO 11 — Escritório 3D com IA
  Referência: "3D Dashboard With AI".

  O que define o efeito:
  1. O painel é um ESCRITÓRIO em 3D isométrico: piso sobre um tablado de madeira,
     duas paredes, um telão com o faturamento, mesas com pessoas e notebooks,
     uma mesa redonda de reunião.
  2. Balões sobre algumas pessoas dizem o que elas estão fazendo agora.
  3. Clicar numa pessoa APROXIMA A CÂMERA até ela e abre a ficha ao lado.
  4. O assistente de IA desliza da direita; a câmera abre espaço para ele.

  O original é uma cena WebGL com modelos 3D. Aqui é uma aproximação honesta em
  CSS 3D puro: caixas feitas de planos, pessoas como "billboards" (planos que
  desfazem a rotação do mundo e ficam sempre de frente), câmera = transform do
  mundo, calculada para centralizar o ponto clicado. Sem biblioteca.

  O que o Manus fez: um dashboard comum de cartões e gráfico — nada de 3D,
  nada de câmera, nada de pessoas.
-->
<style>
  :root {
    --fundo: #e9ebee;
    --vidro: rgba(255, 255, 255, .86);
    --texto: #1b1d21;
    --texto-2: #6a6f78;
    --linha: rgba(20, 24, 32, .08);
    --laranja: #ff5a1f;
    --verde: #22a565;
    --mover: cubic-bezier(.65, 0, .35, 1);
    --mola: cubic-bezier(.22, 1, .36, 1);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { display: flex; flex-direction: column; overflow: hidden; color: var(--texto); background: var(--fundo);
    font-family: "Inter", ui-sans-serif, system-ui, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
  button { font-family: inherit; }

  /* ---------------------------------------------------------- barra de cima */
  .topo { flex: none; display: flex; align-items: center; gap: 16px; height: 50px; padding: 0 16px; background: #fff; border-bottom: 1px solid var(--linha); z-index: 5; }
  .logo { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 13.5px; }
  .logo i { width: 20px; height: 20px; border-radius: 6px; background: var(--laranja); }
  .ferramentas { display: flex; gap: 4px; margin: 0 auto; }
  .ferramentas span { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; color: var(--texto-2); }
  .ferramentas span:first-child { background: #f1f2f4; color: var(--texto); }
  .ferramentas svg, .rail svg { width: 15px; height: 15px; }
  .eu { display: flex; align-items: center; gap: 8px; font-size: 12px; }
  .eu i { width: 26px; height: 26px; border-radius: 50%; background: linear-gradient(135deg, #2f3a4a, #6b7a90); }

  /* ---------------------------------------------------------- palco */
  .palco { position: relative; flex: 1; overflow: hidden; }
  .mundo { position: absolute; left: 50%; top: 50%; width: 1000px; height: 700px; margin: -350px 0 0 -500px;
    transform-style: preserve-3d; transition: transform 1.1s var(--mover); }
  .mundo * { transform-style: preserve-3d; }
  .mundo div { position: absolute; }

  /* piso, tablado e paredes */
  .piso { inset: 0; background: #f6f6f4; box-shadow: 0 0 0 1px #e2e2de inset;
    background-image: linear-gradient(#ececea 1px, transparent 1px), linear-gradient(90deg, #ececea 1px, transparent 1px); background-size: 50px 50px; }
  .borda-f { left: 0; top: 100%; width: 100%; height: 26px; transform-origin: top; transform: rotateX(-90deg); background: linear-gradient(180deg, #c99a68, #a8784b); }
  .borda-e { left: -26px; top: 0; width: 26px; height: 100%; transform-origin: right; transform: rotateY(-90deg); background: linear-gradient(90deg, #a8784b, #c18f5d); }
  .parede-fundo { left: 0; top: -170px; width: 100%; height: 170px; transform-origin: bottom; transform: rotateX(-90deg); background: linear-gradient(180deg, #fbfbfa, #eeeeec); }
  .parede-dir { left: 100%; top: 0; width: 170px; height: 100%; transform-origin: left; transform: rotateY(-90deg); background: linear-gradient(90deg, #e2e3e0, #f2f2f0); }
  .telao { left: 300px; top: 22px; width: 380px; height: 110px; border-radius: 6px; background: #121418; padding: 12px 16px; color: #fff; }
  .telao small { display: block; font-size: 9px; opacity: .6; }
  .telao b { display: block; font-size: 20px; margin-top: 2px; }
  .telao .barras { position: absolute; right: 14px; bottom: 12px; display: flex; align-items: flex-end; gap: 4px; height: 70px; }
  .telao .barras i { display: block; width: 9px; border-radius: 2px 2px 0 0; background: #4b5363; }
  .telao .barras i.alta { background: var(--laranja); }
  .faixa { left: 720px; top: 40px; width: 230px; height: 80px; background: repeating-linear-gradient(90deg, #1b1d21 0 14px, #fbfbfa 14px 28px); opacity: .9; }

  /* caixas: tampa + frente (+y) + lado esquerdo (−x), os dois lados que a câmera vê */
  .caixa .t { inset: 0; }
  .caixa .f { left: 0; top: 100%; width: 100%; transform-origin: top; transform: rotateX(90deg); }
  .caixa .e { left: 0; top: 0; height: 100%; transform-origin: left; transform: rotateY(-90deg); }
  .mesa .t { background: #fff; box-shadow: inset 0 0 0 1px #e4e4e0; }
  .mesa .f, .mesa .e { background: #dcdcd8; }
  .cadeira .t { background: #2a2c31; border-radius: 3px; } .cadeira .f, .cadeira .e { background: #1c1d21; }
  .note { width: 36px; height: 24px; transform-origin: bottom; border-radius: 3px 3px 0 0; background: linear-gradient(180deg, #3a3d44, #24262b); }
  .note::after { content: ""; position: absolute; left: 50%; top: 45%; width: 6px; height: 6px; margin: -3px; border-radius: 50%; background: #8c919b; }

  .redonda { border-radius: 50%; background: #fff; box-shadow: 0 0 0 6px #f0f0ee, 0 18px 30px rgba(0,0,0,.12); }
  .tapete { border-radius: 50%; background: #e7e9ec; }

  /* billboards: desfazem a rotação do mundo e ficam de frente para a câmera */
  .placa { transform-origin: 50% 100%; transform: rotateZ(40deg) rotateX(-58deg); }
  .placa, .placa * { transform-style: flat; }
  .pessoa { width: 46px; height: 74px; cursor: pointer; }
  .pessoa .corpo { left: 5px; bottom: 0; width: 36px; height: 34px; border-radius: 16px 16px 6px 6px; background: var(--camisa); }
  .pessoa .cabeca { left: 9px; top: 6px; width: 28px; height: 30px; border-radius: 46% 46% 44% 44%; background: var(--pele); transition: transform .35s var(--mola); }
  .pessoa .cabelo { left: 7px; top: 2px; width: 32px; height: 18px; border-radius: 16px 16px 6px 6px; background: var(--cabelo); }
  .pessoa .olho { top: 21px; width: 3px; height: 4px; border-radius: 2px; background: #1b1d21; }
  .pessoa .olho.a { left: 17px; } .pessoa .olho.b { left: 26px; }
  .pessoa .ponto { right: 3px; top: 4px; width: 9px; height: 9px; border-radius: 50%; background: var(--verde); box-shadow: 0 0 0 2px #fff; }
  .pessoa.fora .ponto { background: #b9bec7; }
  .pessoa:hover .cabeca, .pessoa:hover .cabelo, .pessoa.ativa .cabeca, .pessoa.ativa .cabelo { transform: translateY(-4px); }
  .pessoa.ativa::before { content: ""; position: absolute; left: -6px; right: -6px; bottom: -6px; height: 14px; border-radius: 50%; box-shadow: 0 0 0 2px var(--laranja); }
  .planta { width: 50px; height: 86px; }
  .planta .vaso { left: 13px; bottom: 0; width: 24px; height: 22px; border-radius: 4px 4px 8px 8px; background: #f1f1ef; box-shadow: inset -4px 0 0 #dcdcd8; }
  .planta .folhas { left: 0; top: 0; width: 50px; height: 66px; border-radius: 50% 50% 45% 45%; background: radial-gradient(circle at 40% 35%, #5fae4e, #2f7a34); }
  .holo { width: 90px; height: 74px; display: flex; align-items: flex-end; justify-content: center; gap: 4px; }
  .holo i { position: static; display: block; width: 9px; border-radius: 2px 2px 0 0; background: linear-gradient(180deg, #59c7ff, rgba(47,120,255,.35)); box-shadow: 0 0 10px rgba(80,180,255,.55); }

  /* ---------------------------------------------------------- camada 2D por cima */
  .cartao { position: absolute; background: var(--vidro); backdrop-filter: blur(14px); border-radius: 14px; box-shadow: 0 1px 2px rgba(0,0,0,.05), 0 12px 30px -16px rgba(0,0,0,.3), inset 0 0 0 1px rgba(255,255,255,.7); }
  .ola { left: 64px; top: 14px; padding: 12px 16px; }
  .ola b { display: block; font-size: 14px; } .ola small { font-size: 11.5px; color: var(--texto-2); }
  .rail { position: absolute; left: 14px; top: 14px; display: flex; flex-direction: column; gap: 4px; padding: 6px; border-radius: 12px; background: #fff; box-shadow: 0 6px 20px -12px rgba(0,0,0,.3); }
  .rail span { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; color: var(--texto-2); }
  .acoes { position: absolute; right: 14px; top: 14px; display: flex; gap: 6px; transition: right .6s var(--mola); }
  .acoes button { border: 0; border-radius: 999px; padding: 8px 13px; font-size: 12px; cursor: pointer; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .acoes .ia-bt { background: var(--texto); color: #fff; }
  .chat-aberto .acoes { right: 374px; }

  .balao { position: absolute; left: 0; top: 0; max-width: 170px; padding: 7px 10px; border-radius: 10px; font-size: 10.5px; line-height: 1.35; pointer-events: none;
    background: #fff; box-shadow: 0 6px 18px -8px rgba(0,0,0,.35); transform: translate(-50%, -100%); transition: opacity .35s; }
  .balao b { display: block; font-size: 9.5px; color: var(--texto-2); font-weight: 600; margin-bottom: 1px; }
  .balao::after { content: ""; position: absolute; left: 50%; bottom: -5px; width: 10px; height: 10px; margin-left: -5px; background: #fff; transform: rotate(45deg); }
  .balao.some { opacity: 0; }

  .ficha { left: 64px; top: 84px; width: 250px; padding: 16px; opacity: 0; transform: translateX(-16px); filter: blur(6px); pointer-events: none;
    transition: opacity .45s, transform .6s var(--mola), filter .45s; }
  .foco .ficha { opacity: 1; transform: none; filter: none; pointer-events: auto; transition-delay: .45s; }
  .ficha .quem { display: flex; align-items: center; gap: 10px; }
  .ficha .rosto { width: 40px; height: 40px; border-radius: 50%; flex: none; }
  .ficha h3 { margin: 0; font-size: 14px; } .ficha .cargo { font-size: 11.5px; color: var(--texto-2); }
  .ficha .estado { display: inline-flex; align-items: center; gap: 5px; margin: 12px 0 8px; padding: 3px 9px; border-radius: 999px; background: rgba(34,165,101,.12); color: #157a49; font-size: 11px; font-weight: 600; }
  .ficha .estado.fora { background: #eef0f3; color: var(--texto-2); }
  .ficha p { margin: 0 0 12px; font-size: 12px; color: var(--texto-2); }
  .ficha .numeros { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
  .ficha .numeros div { padding: 8px 10px; border-radius: 10px; background: #f3f4f6; }
  .ficha .numeros small { display: block; font-size: 10px; color: var(--texto-2); } .ficha .numeros b { font-size: 15px; }
  .ficha .botoes { display: flex; gap: 6px; }
  .ficha .botoes button { flex: 1; border: 0; border-radius: 9px; padding: 8px; font-size: 11.5px; cursor: pointer; background: #f1f2f4; }
  .ficha .botoes button.forte { background: var(--texto); color: #fff; }

  /* ---------------------------------------------------------- assistente */
  .chat { position: absolute; right: 12px; top: 12px; bottom: 12px; width: 350px; display: flex; flex-direction: column; border-radius: 16px; background: #fff;
    box-shadow: 0 24px 60px -24px rgba(0,0,0,.4), 0 0 0 1px var(--linha); transform: translateX(calc(100% + 24px)); transition: transform .65s var(--mola); z-index: 4; }
  .chat-aberto .chat { transform: none; }
  .chat header { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--linha); }
  .chat header i { width: 30px; height: 30px; border-radius: 10px; background: conic-gradient(from 200deg, #ff5a1f, #ffb21f, #ff5a1f); }
  .chat header b { display: block; font-size: 13px; } .chat header small { font-size: 11px; color: var(--texto-2); }
  .chat header button { margin-left: auto; border: 0; background: #f1f2f4; border-radius: 8px; width: 28px; height: 28px; cursor: pointer; }
  .mensagens { flex: 1; overflow-y: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 86%; padding: 9px 12px; border-radius: 12px; font-size: 12.5px; line-height: 1.45; }
  .msg.ia { background: #f3f4f6; border-top-left-radius: 4px; }
  .msg.eu { align-self: flex-end; background: var(--texto); color: #fff; border-top-right-radius: 4px; }
  .digitando { display: inline-flex; gap: 3px; } .digitando i { width: 5px; height: 5px; border-radius: 50%; background: #9aa0aa; animation: pula 1s infinite; }
  .digitando i:nth-child(2) { animation-delay: .15s; } .digitando i:nth-child(3) { animation-delay: .3s; }
  @keyframes pula { 0%, 60%, 100% { transform: none; opacity: .5; } 30% { transform: translateY(-3px); opacity: 1; } }
  .sugestoes { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 16px 10px; }
  .sugestoes button { border: 0; border-radius: 999px; padding: 6px 10px; font-size: 11px; cursor: pointer; background: #f1f2f4; }
  .chat form { display: flex; gap: 6px; padding: 10px 12px 12px; border-top: 1px solid var(--linha); }
  .chat input { flex: 1; min-width: 0; border: 0; border-radius: 10px; padding: 9px 12px; background: #f3f4f6; font-family: inherit; font-size: 12.5px; outline: none; }
  .chat form button { border: 0; border-radius: 10px; padding: 0 14px; background: var(--laranja); color: #fff; font-weight: 600; cursor: pointer; }

  @media (prefers-reduced-motion: reduce) { .mundo, .chat, .ficha { transition-duration: .01s !important; } }
  @media (max-width: 760px) { .ferramentas, .acoes button:not(.ia-bt), .ola { display: none; } .chat { left: 12px; width: auto; } .ficha { left: 12px; top: 14px; } }
</style>
</head>
<body>
  <header class="topo">
    <div class="logo"><i></i>Nexo HQ</div>
    <div class="ferramentas" aria-hidden="true">
      <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4l7 17 2-7 7-2z"/></svg></span>
      <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="2"/></svg></span>
      <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M5 20c1.4-3.5 4-5 7-5s5.6 1.5 7 5"/></svg></span>
      <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg></span>
    </div>
    <div class="eu"><i></i>Admin</div>
  </header>

  <main class="palco" id="palco">
    <div class="mundo" id="mundo"></div>

    <nav class="rail" aria-hidden="true">
      <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7v9H3z"/></svg></span>
      <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c1-3.3 3.4-5 6.5-5s5.5 1.7 6.5 5M16 4.5a3.5 3.5 0 0 1 0 7M18 15c2 .6 3.2 2.3 3.6 5"/></svg></span>
      <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg></span>
    </nav>
    <div class="cartao ola"><b>Boa noite, Admin</b><small id="resumo"></small></div>
    <div class="acoes">
      <button>Adicionar pessoa</button><button>Nova mesa</button><button class="ia-bt" id="abrirIa">✦ Assistente IA</button>
    </div>
    <section class="cartao ficha" id="ficha" aria-live="polite"></section>
    <div id="baloes"></div>

    <aside class="chat" id="chat" aria-label="Assistente de IA">
      <header><i></i><div><b>Lina</b><small>IA da equipe · vê o escritório todo</small></div><button id="fecharIa" aria-label="Fechar">✕</button></header>
      <div class="mensagens" id="mensagens"></div>
      <div class="sugestoes" id="sugestoes">
        <button>Quem está livre agora?</button><button>Como está o relatório?</button><button>Resumo do dia</button>
      </div>
      <form id="form"><input id="pergunta" placeholder="Pergunte sobre a equipe…" autocomplete="off" /><button>Enviar</button></form>
    </aside>
  </main>

<script>
  // ------------------------------------------------------------ dados
  const PESSOAS = [
    { nome: 'Bia Santos', cargo: 'Analista financeira', pele: '#f0c7a4', cabelo: '#3b2414', camisa: '#ff7a45', faz: 'Fechando o relatório de março', tarefas: 7, foco: '3h40', fala: 'Relatório de março quase pronto 📊' },
    { nome: 'Davi Rocha', cargo: 'Desenvolvedor', pele: '#8d5a3b', cabelo: '#16110d', camisa: '#2f6bff', faz: 'Livre — esperando revisão', tarefas: 3, foco: '1h15' },
    { nome: 'Lia Nunes', cargo: 'Designer', pele: '#f6d3b8', cabelo: '#b5562a', camisa: '#7c4dff', faz: 'Desenhando a tela de cobrança', tarefas: 5, foco: '2h50', fala: 'Alguém revisa a tela de cobrança?' },
    { nome: 'Rafa Lima', cargo: 'Suporte', pele: '#c68a62', cabelo: '#2a1a10', camisa: '#22a565', faz: 'Livre', tarefas: 2, foco: '0h40' },
    { nome: 'Caio Prado', cargo: 'Vendas', pele: '#e9b892', cabelo: '#6b4a2b', camisa: '#1b1d21', faz: 'Em ligação com cliente', tarefas: 6, foco: '2h05' },
    { nome: 'Nina Faria', cargo: 'Produto', pele: '#5c3a26', cabelo: '#0f0b08', camisa: '#ffb21f', faz: 'Planejando a próxima sprint', tarefas: 4, foco: '2h30', fala: 'Sprint 14 fechada ✅' },
    { nome: 'Leo Brito', cargo: 'Desenvolvedor', pele: '#f2cdb0', cabelo: '#d9b26a', camisa: '#e04a4a', faz: 'Corrigindo o login', tarefas: 5, foco: '3h10' },
    { nome: 'Gabi Melo', cargo: 'Marketing', pele: '#a8714d', cabelo: '#2b1a10', camisa: '#14b8a6', faz: 'Agendando a campanha', tarefas: 4, foco: '1h50', fora: true },
    { nome: 'Teo Alves', cargo: 'Dados', pele: '#eec09c', cabelo: '#4a3020', camisa: '#475569', faz: 'Atualizando o painel de vendas', tarefas: 5, foco: '2h20' },
    { nome: 'Malu Reis', cargo: 'RH', pele: '#7a4c31', cabelo: '#1a120c', camisa: '#ec4899', faz: 'Entrevistas da tarde', tarefas: 3, foco: '1h00', fora: true },
    { nome: 'Ivo Costa', cargo: 'Financeiro', pele: '#dfa982', cabelo: '#2d2d2d', camisa: '#0ea5e9', faz: 'Conciliando o caixa', tarefas: 6, foco: '2h45' },
    { nome: 'Sol Duarte', cargo: 'Operações', pele: '#f3cfb4', cabelo: '#8a4b1f', camisa: '#84cc16', faz: 'Livre', tarefas: 2, foco: '0h55' },
  ];

  // ------------------------------------------------------------ construir o mundo
  const $ = (id) => document.getElementById(id);
  const mundo = $('mundo'), palco = $('palco');
  const W = 1000, H = 700, ROT_Z = -40, ROT_X = 58;

  const caixa = (cls, x, y, w, d, h, extra = '') =>
    `<div class="caixa ${cls}" style="left:${x}px;top:${y}px;width:${w}px;height:${d}px;transform:translateZ(${extra ? extra : 0}px)">
      <div class="t" style="transform:translateZ(${h}px)"></div><div class="f" style="height:${h}px"></div><div class="e" style="width:${h}px"></div></div>`;
  // billboard: fica no ponto (x, y) do piso, na altura z, e desfaz a rotação do
  // mundo para encarar a câmera. `vars` entra no mesmo style — dois atributos
  // style no mesmo elemento fazem o navegador jogar o segundo fora.
  const placa = (cls, x, y, z, w, h, dentro, attrs = '', vars = '') =>
    `<div class="placa ${cls}" ${attrs} style="${vars}left:${x - w / 2}px;top:${y - h}px;width:${w}px;height:${h}px;transform:translateZ(${z}px) rotateZ(${-ROT_Z}deg) rotateX(${-ROT_X}deg)">${dentro}</div>`;

  let html = `<div class="piso"></div><div class="borda-f"></div><div class="borda-e"></div>
    <div class="parede-fundo"><div class="telao"><small>Faturamento do mês</small><b>R$ 432.890</b><small>↗ 12% sobre fevereiro</small>
      <div class="barras">${[30, 42, 36, 50, 46, 58, 54, 66, 62, 70].map((v, i) => `<i class="${i === 9 ? 'alta' : ''}" style="height:${v}px"></i>`).join('')}</div></div>
      <div class="faixa"></div></div>
    <div class="parede-dir"></div>`;

  // mesas em 3 fileiras × 4; a pessoa senta do lado de lá, de frente para a câmera
  const MESA = { w: 112, d: 56, h: 34 };
  const posicoes = [];
  [210, 350, 490].forEach((y) => [110, 250, 390, 530].forEach((x) => posicoes.push({ x, y })));
  posicoes.forEach(({ x, y }, i) => {
    const p = PESSOAS[i];
    html += caixa('cadeira', x + MESA.w / 2 - 13, y - 30, 26, 22, 20);
    html += placa(`pessoa${p.fora ? ' fora' : ''}`, x + MESA.w / 2, y - 14, 4, 46, 74,
      `<div class="corpo"></div><div class="cabeca"></div><div class="cabelo"></div><div class="olho a"></div><div class="olho b"></div><div class="ponto"></div>`,
      `data-i="${i}" role="button" tabindex="0" aria-label="${p.nome}"`,
      `--pele:${p.pele};--cabelo:${p.cabelo};--camisa:${p.camisa};`);
    html += caixa('mesa', x, y, MESA.w, MESA.d, MESA.h);
    html += `<div class="note" style="left:${x + MESA.w / 2 - 18}px;top:${y + 14}px;transform:translateZ(${MESA.h}px) rotateX(-90deg)"></div>`;
  });

  // reunião: tapete, mesa redonda, cadeiras em volta, holograma no meio
  const RX = 820, RY = 480;
  html += `<div class="tapete" style="left:${RX - 140}px;top:${RY - 140}px;width:280px;height:280px"></div>`;
  for (let k = 0; k < 8; k++) {
    const a = (k / 8) * Math.PI * 2;
    html += caixa('cadeira', RX + Math.cos(a) * 112 - 11, RY + Math.sin(a) * 112 - 11, 22, 22, 22);
  }
  html += `<div class="redonda" style="left:${RX - 80}px;top:${RY - 80}px;width:160px;height:160px;transform:translateZ(32px)"></div>`;
  html += placa('holo', RX, RY, 32, 90, 74, [26, 40, 34, 52, 46, 64].map((v) => `<i style="height:${v}px"></i>`).join(''));
  html += placa('planta', 960, 50, 0, 50, 86, '<div class="folhas"></div><div class="vaso"></div>');
  html += placa('planta', 690, 130, 0, 50, 86, '<div class="folhas"></div><div class="vaso"></div>');
  html += placa('planta', 50, 660, 0, 50, 86, '<div class="folhas"></div><div class="vaso"></div>');
  mundo.innerHTML = html;
  const pessoasEl = [...mundo.querySelectorAll('.pessoa')];

  $('resumo').textContent = `${PESSOAS.length} pessoas · ${PESSOAS.filter((p) => !p.fora).length} online agora`;

  // ------------------------------------------------------------ câmera
  // ponto do piso (x, y) → tela, pelas mesmas rotações do mundo
  const rad = (g) => (g * Math.PI) / 180;
  function projetar(x, y) {
    const vx = x - W / 2, vy = y - H / 2, a = rad(ROT_Z), b = rad(ROT_X);
    const px = vx * Math.cos(a) - vy * Math.sin(a);
    const py = (vx * Math.sin(a) + vy * Math.cos(a)) * Math.cos(b);
    return { px, py };
  }
  const cam = { tx: 0, ty: 0, s: 1 };
  let foco = -1, chatAberto = false;
  function aplicar() { mundo.style.transform = `translate(${cam.tx}px, ${cam.ty}px) scale(${cam.s}) rotateX(${ROT_X}deg) rotateZ(${ROT_Z}deg)`; }
  function visaoGeral() {
    const w = palco.clientWidth - (chatAberto ? 370 : 0), h = palco.clientHeight;
    cam.s = Math.min(w / 1250, h / 720, 1.1);
    cam.tx = chatAberto ? -185 : 0; cam.ty = h * 0.05;
    aplicar();
  }
  function olharPara(i) {
    const { x, y } = posicoes[i];
    const q = projetar(x + MESA.w / 2, y - 14);
    const w = palco.clientWidth - (chatAberto ? 370 : 0);
    cam.s = Math.min(1.9, Math.max(1.2, w / 700));
    // o centro do palco é a origem do transform; o alvo fica um pouco à direita da ficha
    const alvoX = (chatAberto ? -185 : 0) + Math.min(110, w * 0.12), alvoY = 30;
    cam.tx = alvoX - cam.s * q.px;
    cam.ty = alvoY - cam.s * (q.py - 40);
    aplicar();
  }

  // ------------------------------------------------------------ foco numa pessoa
  function focar(i) {
    foco = i;
    palco.classList.add('foco');
    pessoasEl.forEach((el, j) => el.classList.toggle('ativa', j === i));
    const p = PESSOAS[i];
    $('ficha').innerHTML = `
      <div class="quem"><div class="rosto" style="background:radial-gradient(circle at 50% 38%, ${p.pele} 0 34%, ${p.camisa} 35%)"></div>
        <div><h3>${p.nome}</h3><div class="cargo">${p.cargo}</div></div></div>
      <div class="estado ${p.fora ? 'fora' : ''}">● ${p.fora ? 'Ausente' : 'Online'}</div>
      <p>Agora: ${p.faz}.</p>
      <div class="numeros"><div><small>Tarefas hoje</small><b>${p.tarefas}</b></div><div><small>Tempo em foco</small><b>${p.foco}</b></div></div>
      <div class="botoes"><button class="forte" data-acao="perguntar">Perguntar à IA</button><button data-acao="voltar">Voltar</button></div>`;
    olharPara(i);
  }
  function soltar() {
    if (foco < 0) return;
    foco = -1;
    palco.classList.remove('foco');
    pessoasEl.forEach((el) => el.classList.remove('ativa'));
    visaoGeral();
  }

  // ------------------------------------------------------------ balões (seguem a cabeça, mesmo durante a viagem da câmera)
  const comBalao = PESSOAS.map((p, i) => (p.fala ? i : -1)).filter((i) => i >= 0);
  $('baloes').innerHTML = comBalao.map((i) => `<div class="balao" data-i="${i}"><b>${PESSOAS[i].nome.split(' ')[0]}</b>${PESSOAS[i].fala}</div>`).join('');
  const baloes = [...$('baloes').children];
  function seguir() {
    const base = palco.getBoundingClientRect();
    baloes.forEach((b) => {
      const i = +b.dataset.i;
      const r = pessoasEl[i].querySelector('.cabelo').getBoundingClientRect();
      b.style.transform = `translate(${r.left + r.width / 2 - base.left}px, ${r.top - base.top - 10}px) translate(-50%, -100%)`;
      b.classList.toggle('some', foco >= 0 && foco !== i);
    });
    requestAnimationFrame(seguir);
  }

  // ------------------------------------------------------------ assistente
  const mensagens = $('mensagens');
  function falar(texto, quem) {
    const m = document.createElement('div');
    m.className = `msg ${quem}`;
    m.textContent = texto;
    mensagens.appendChild(m);
    m.animate([{ opacity: 0, transform: 'translateY(6px)' }, { opacity: 1, transform: 'none' }], { duration: 300, easing: 'cubic-bezier(.22,1,.36,1)' });
    mensagens.scrollTop = mensagens.scrollHeight;
  }
  function responder(pergunta) {
    const t = pergunta.toLowerCase();
    const livres = PESSOAS.filter((p) => !p.fora && /livre/i.test(p.faz)).map((p) => p.nome.split(' ')[0]);
    if (/livre|dispon/.test(t)) return `Estão livres agora: ${livres.join(', ')}. Quer que eu passe a revisão da tela de cobrança para o Davi?`;
    if (/relat/.test(t)) return 'O relatório de março está 80% pronto — a Bia fecha hoje às 17h. Faltam só as despesas de viagem.';
    if (/resumo|dia/.test(t)) return `Hoje: 31 tarefas fechadas, ${PESSOAS.filter((p) => !p.fora).length} pessoas online, faturamento do mês em R$ 432.890 (+12%).`;
    const quem = PESSOAS.find((p) => t.includes(p.nome.split(' ')[0].toLowerCase()));
    if (quem) return `${quem.nome} (${quem.cargo}) está: ${quem.faz.toLowerCase()}. ${quem.tarefas} tarefas hoje, ${quem.foco} em foco.`;
    return `Posso ver o escritório inteiro. Pergunte quem está livre, como está um projeto, ou sobre alguém pelo nome — por exemplo, "e a Lia?".`;
  }
  function perguntar(texto) {
    if (!texto.trim()) return;
    falar(texto, 'eu');
    const d = document.createElement('div');
    d.className = 'msg ia';
    d.innerHTML = '<span class="digitando"><i></i><i></i><i></i></span>';
    mensagens.appendChild(d);
    mensagens.scrollTop = mensagens.scrollHeight;
    setTimeout(() => { d.remove(); falar(responder(texto), 'ia'); }, 700);
  }
  function abrirChat(abrir) {
    chatAberto = abrir;
    palco.classList.toggle('chat-aberto', abrir);
    if (foco >= 0) olharPara(foco); else visaoGeral();
    if (abrir && !mensagens.children.length) falar('Oi! Sou a Lina, a IA da equipe. Clique em alguém no escritório ou me pergunte o que quiser.', 'ia');
    if (abrir) setTimeout(() => $('pergunta').focus({ preventScroll: true }), 350);
  }

  // ------------------------------------------------------------ eventos
  mundo.addEventListener('click', (e) => {
    const p = e.target.closest('.pessoa');
    if (p) focar(+p.dataset.i); else soltar();
  });
  mundo.addEventListener('keydown', (e) => {
    const p = e.target.closest('.pessoa');
    if (p && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); focar(+p.dataset.i); }
  });
  $('ficha').addEventListener('click', (e) => {
    const a = e.target.closest('[data-acao]');
    if (!a) return;
    if (a.dataset.acao === 'voltar') soltar();
    if (a.dataset.acao === 'perguntar') { const p = PESSOAS[foco]; abrirChat(true); perguntar(`E a ${p.nome.split(' ')[0]}?`); }
  });
  $('abrirIa').addEventListener('click', () => abrirChat(!chatAberto));
  $('fecharIa').addEventListener('click', () => abrirChat(false));
  $('sugestoes').addEventListener('click', (e) => { if (e.target.matches('button')) perguntar(e.target.textContent); });
  $('form').addEventListener('submit', (e) => { e.preventDefault(); perguntar($('pergunta').value); $('pergunta').value = ''; });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { if (foco >= 0) soltar(); else abrirChat(false); } });
  addEventListener('resize', () => (foco >= 0 ? olharPara(foco) : visaoGeral()));

  visaoGeral();
  requestAnimationFrame(seguir);
</script>
</body>
</html>
